[project]
name = "dify-buffer"
version = "0.1.0"
description = "Buffer social publishing tools for Dify"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"common/queries.py" = ["UP031"]
