          channel_name\"], \"platform\": platform, \"approved_text\": post_text, \"assets_json\": json.dumps(assets),\
          \ \"image_count\": len(assets), \"ai_assisted\": bool(delivery.get(\"ai_assisted\")), \"mode\": mode,\
          \ \"due_at\": due_at}\n"
