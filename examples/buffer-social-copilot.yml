          }\n    if delivery_method not in modes:\n        raise ValueError(\"Choose a delivery method.\")\n   \
          \ if content_mode not in {\"Original Content\", \"AI Assistant\"}:\n        raise ValueError(\"Choose\
          \ Original Content or AI Assistant.\")\n    zone_name = str(target.get(\"timezone\") or \"UTC\")\n   \
          \ due_at = \"\"\n    when = {\"Save Draft\": \"Saved as an unpublished draft\", \"Add to Queue\": \"Next\
          \ available Buffer queue slot\", \"Publish Now\": \"Immediately after your final confirmation\", \"Schedule\"\
          : \"\"}[delivery_method]\n    if delivery_method == \"Schedule\":\n        if not isinstance(schedule_at,\
          \ str) or not schedule_at.strip():\n            raise ValueError(\"Schedule requires a future publish\
          \ date and time.\")\n        try:\n            scheduled = datetime.fromisoformat(schedule_at.strip().replace(\"\
          Z\", \"+00:00\"))\n        except ValueError as exc:\n            raise ValueError(\"Use YYYY-MM-DD HH:mm\
          \ or an ISO timestamp with a UTC offset.\") from exc\n        if scheduled.tzinfo is None:\n         \
          \   try:\n                zone = ZoneInfo(zone_name)\n            except ZoneInfoNotFoundError as exc:\n\
          \                raise ValueError(\"The account time zone is unavailable. Enter an ISO timestamp with\
          \ an explicit UTC offset.\") from exc\n            valid = []\n            for fold in (0, 1):\n     \
          \           candidate = scheduled.replace(tzinfo=zone, fold=fold)\n                if candidate.astimezone(timezone.utc).astimezone(zone).replace(tzinfo=None)\
          \ == scheduled:\n                    valid.append(candidate)\n            if not valid:\n            \
          \    raise ValueError(\"That local time does not exist because of daylight saving. Choose another time.\"\
