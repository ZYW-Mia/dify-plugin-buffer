          \ \"due_at\": due_at, \"timezone\": zone_name, \"ai_assisted\": content_mode == \"AI Assistant\"}\n  \
          \  summary = \"Platform: \" + platform + \"\\n\\nAccount: \" + account + \"\\n\\nDelivery: \" + delivery_method\
          \ + \"\\n\\nTiming: \" + when\n    return {\"delivery\": delivery, \"delivery_summary\": summary, \"material\"\
          : material, \"platform\": platform}\n\ndef main(account: str, post_text: str, delivery_method: str, schedule_at:\
          \ str, account_map: dict, content_mode: str, images: list = None) -> dict:\n    result = resolve_delivery(account,\
          \ post_text, delivery_method, schedule_at, account_map, content_mode)\n    delivery = result[\"delivery\"\
