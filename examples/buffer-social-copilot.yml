          \ ValueError(\"That local time is ambiguous because of daylight saving. Include an explicit UTC offset.\"\
          )\n            scheduled = valid[0]\n        scheduled = scheduled.astimezone(timezone.utc)\n        if\
          \ scheduled <= datetime.now(timezone.utc):\n            raise ValueError(\"The scheduled publish time\
          \ must be in the future.\")\n        due_at = scheduled.isoformat(timespec=\"milliseconds\").replace(\"\
          +00:00\", \"Z\")\n        when = \"Scheduled for \" + schedule_at.strip() + \" (account time zone: \"\
          \ + zone_name + \"; UTC: \" + due_at + \")\"\n    platform = target[\"platform\"]\n    delivery = {\"\
