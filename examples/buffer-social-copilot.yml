    - data:
        code: "import json\nfrom urllib.parse import urlsplit\nfrom datetime import datetime, timezone\nfrom zoneinfo\
          \ import ZoneInfo, ZoneInfoNotFoundError\n\ndef resolve_delivery(account: str, material: str, delivery_method:\
          \ str, schedule_at: str, account_map: dict, content_mode: str) -> dict:\n    target = account_map.get(account)\n\
          \    supported = {\"X\", \"Bluesky\", \"LinkedIn\"}\n    if not isinstance(target, dict) or target.get(\"\
          platform\") not in supported or not target.get(\"id\"):\n        raise ValueError(\"Choose a supported\
