    - data:
        code: "def main(results: list, organization_names: dict) -> dict:\n    platform_names = {\"twitter\": \"\
          X\", \"x\": \"X\", \"bluesky\": \"Bluesky\", \"linkedin\": \"LinkedIn\", \"instagram\": \"Instagram\"\
          , \"facebook\": \"Facebook\", \"threads\": \"Threads\", \"tiktok\": \"TikTok\", \"youtube\": \"YouTube\"\
          , \"pinterest\": \"Pinterest\", \"mastodon\": \"Mastodon\", \"googlebusiness\": \"Google Business Profile\"\
          , \"googlebusinessprofile\": \"Google Business Profile\"}\n    supported = {\"X\", \"Bluesky\", \"LinkedIn\"\
          }\n    channels = []\n    def collect(value):\n        if isinstance(value, list):\n            for item\
          \ in value:\n                collect(item)\n        elif isinstance(value, dict) and isinstance(value.get(\"\
          channels\"), list):\n            channels.extend(value[\"channels\"])\n    collect(results)\n    account_map\
          \ = {}\n    connected_labels = []\n    unavailable_labels = []\n    seen_ids = set()\n    for c in channels:\n\
          \        if not isinstance(c, dict) or c.get(\"isDisconnected\") or c.get(\"isLocked\") or not c.get(\"\
          id\"):\n            continue\n        organization_id = str(c.get(\"organizationId\", \"\"))\n       \
          \ if organization_id not in organization_names or str(c[\"id\"]) in seen_ids:\n            continue\n\
          \        seen_ids.add(str(c[\"id\"]))\n        service = str(c.get(\"service\", \"\")).lower()\n     \
          \   platform = platform_names.get(service, str(c.get(\"service\") or \"Social account\"))\n        name\
          \ = str(c.get(\"displayName\") or c.get(\"name\") or \"Connected account\")\n        handle = str(c.get(\"\
          name\") or \"\")\n        if handle and handle != name:\n            name += \" (\" + handle + \")\"\n\
          \        label = platform + \" · \" + name + \" · \" + organization_names[organization_id]\n        base\
          \ = label\n        suffix = 2\n        while label in connected_labels:\n            label = base + \"\
          \ · Account \" + str(suffix)\n            suffix += 1\n        connected_labels.append(label)\n      \
          \  if platform in supported:\n            account_map[label] = {\"id\": str(c[\"id\"]), \"platform\":\
          \ platform, \"service\": service, \"organization_id\": organization_id, \"timezone\": str(c.get(\"timezone\"\
          ) or \"UTC\")}\n        else:\n            unavailable_labels.append(label)\n    report = \"\\n\".join(\"\
          - \" + label + (\" (time zone: \" + account_map[label][\"timezone\"] + \")\" if label in account_map else\
          \ \"\") for label in connected_labels) or \"No connected accounts are available under the configured Buffer\
          \ authorization.\"\n    if unavailable_labels:\n        report += \"\\n\\nThis template currently delivers\
          \ to X, Bluesky, and LinkedIn. Other connected platforms are listed above for visibility.\"\n    report\
          \ += \"\\n\\nChoose an account below. Buffer validates the actual network and account limits, including\
          \ URL and Unicode counting rules.\"\n    options = list(account_map) or [\"No supported connected account\
          \ — cancel and check the Buffer connection\"]\n    message = \"Choose a destination and delivery method.\
          \ Only Schedule needs a publish time. Account choices come from the Buffer authorization configured for\
          \ this workflow.\" if account_map else \"No supported account is available. Cancel and connect an X, Bluesky,\
          \ or LinkedIn account in Buffer.\"\n    return {\"account_options\": options, \"account_map\": account_map,\
          \ \"account_message\": message, \"connected_accounts_report\": report}\n"
        code_language: python3
        desc: List all connected accounts and build destination choices by platform and account name. No platform
          is chosen at the start.
